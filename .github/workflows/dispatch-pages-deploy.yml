name: Refresh Pages after WIP updates

on:
  push:
    branches: [wip]

permissions:
  actions: write
  contents: read

jobs:
  request-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Request deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow run deploy-pages.yml --repo "$REPOSITORY" --ref main
