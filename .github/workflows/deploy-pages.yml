name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out main site
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-src

      - name: Check out WIP preview
        uses: actions/checkout@v6
        with:
          ref: wip
          path: wip-src

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build main site
        run: python build.py
        working-directory: main-src

      - name: Build WIP preview
        run: python build.py
        working-directory: wip-src

      - name: Assemble the Pages artifact
        run: |
          mkdir -p _site/wip
          cp main-src/index.html main-src/data.json _site/
          cp wip-src/index.html wip-src/data.json _site/wip/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
