<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#16291f">
  <meta name="description" content="Explore the songs, artists, and albums Max has been listening to on Spotify.">
  <title>Max’s Soundlog — My listening archive</title>
  <script>
    // Set the saved preference before the first paint to avoid a theme flash.
    (() => {
      let preference = 'system';
      try {
        const saved = localStorage.getItem('soundlog-theme');
        if (['system', 'light', 'dark'].includes(saved)) preference = saved;
      } catch (_) {}
      const prefersDark = typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches;
      const resolved = preference === 'system' ? (prefersDark ? 'dark' : 'light') : preference;
      document.documentElement.dataset.theme = resolved;
      document.documentElement.dataset.themePreference = preference;
      document.documentElement.style.colorScheme = resolved;
    })();
  </script>
  <style>/*__FONT_CSS__*/
/*__SITE_CSS__*/</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#overview" data-action="navigate" data-view="overview" aria-label="Max’s Soundlog home">
        <span class="brand-mark"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.8 9.1c4.6-2.6 9.8-2.6 14.4.1M6.4 12.5c3.5-1.8 7.8-1.7 11.3.2M8.2 15.9c2.4-1.1 5.2-1 7.6.2" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg></span>
        <span class="brand-name">soundlog<span>.</span><small class="brand-sub">MAX’S ARCHIVE</small></span>
      </a>
      <div class="side-label">Max&#39;s Library</div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
    </aside>
    <main class="main-shell">
      <header class="topbar">
        <div class="topbar-right">
          <div class="range-control" title="Last 7 and 30 days are measured from the latest recorded date.">
            <span class="sr-only">Date range</span>
            <select id="range-select" aria-label="Filter by date range">
              <option value="all">All dates</option>
              <option value="7">Last 7 days</option>
              <option value="30">Last 30 days</option>
              <option value="month">Latest month</option>
            </select>
          </div>
          <div class="theme-control" title="Choose light, dark, or follow your device">
            <span class="sr-only">Color theme</span>
            <select id="theme-select" aria-label="Color theme">
              <option value="system">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>
          <div class="language-control" title="Choose a language">
            <span class="sr-only">Language</span>
            <select id="language-select" aria-label="Language">
              <option value="en">English</option>
              <option value="de">Deutsch</option>
            </select>
          </div>
        </div>
      </header>
      <div id="page-content" class="page-content" aria-live="polite"><div class="empty-state"><strong>Loading Max’s listening archive…</strong></div></div>
    </main>
  </div>
  <dialog id="detail-dialog" class="modal large" aria-label="Listening details"><div id="detail-content"></div></dialog>
  <script type="application/json" id="embedded-data">/*__EMBEDDED_JSON__*/</script>
  <script type="application/json" id="cached-covers">/*__COVERS_JSON__*/</script>
  <script>/*__APP_JS__*/</script>
</body>
</html>
